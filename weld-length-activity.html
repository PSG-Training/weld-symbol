<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read the Weld Length</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --psg-blue:#077CAB; --psg-navy:#0C2340; --card-gray:#EAEAEA;
    --page-bg:#F5F5F5; --white:#FFFFFF; --correct:#1F7A3D; --incorrect:#B3261E;
    --font-head:"Montserrat","Segoe UI",Arial,sans-serif;
    --font-body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding:0;overflow:hidden;}
  body{background:var(--page-bg);font-family:var(--font-body);color:var(--psg-navy);-webkit-font-smoothing:antialiased;}
  .wrap{
    height:100%;max-width:1100px;margin:0 auto;
    padding:clamp(10px,2.2vh,22px) clamp(12px,2vw,24px);
    display:flex;flex-direction:column;gap:clamp(6px,1.2vh,14px);
    min-height:0;overflow:auto;
  }
  .head{flex:0 0 auto;}
  .toprow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  h1{font-family:var(--font-head);font-weight:700;font-size:clamp(17px,min(3.2vw,4.4vh),30px);line-height:1.15;margin:0 0 5px;}
  .progress{font-family:var(--font-head);font-weight:600;font-size:clamp(11px,min(1.4vw,1.9vh),14px);color:var(--psg-blue);white-space:nowrap;}
  .rule{height:4px;background:var(--psg-blue);width:58px;border-radius:2px;margin:0 0 clamp(6px,1.2vh,12px);}
  .prompt{font-size:clamp(14px,min(2vw,2.6vh),19px);line-height:1.35;margin:0;max-width:75ch;}

  .given{
    flex:0 1 auto;height:clamp(90px,26vh,220px);min-height:80px;
    background:var(--white);border:2px solid var(--card-gray);border-radius:10px;
    display:flex;align-items:center;justify-content:center;padding:4px;
  }
  .given svg{width:100%;height:100%;display:block;}
  .given-label,.hint{font-size:clamp(11px,min(1.4vw,1.9vh),14px);color:#5A6B7D;margin:0;}

  .options{
    flex:1 1 auto;min-height:140px;display:grid;
    grid-template-columns:repeat(3,1fr);gap:clamp(8px,1.4vw,18px);
  }
  .opt{
    background:var(--white);border:3px solid var(--card-gray);border-radius:10px;
    padding:clamp(4px,1vh,10px);cursor:pointer;display:flex;flex-direction:column;
    align-items:center;gap:4px;min-height:0;overflow:hidden;
    font-family:var(--font-body);color:var(--psg-navy);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .opt:hover:not(.locked){border-color:var(--psg-blue);box-shadow:0 4px 14px rgba(12,35,64,.12);}
  .opt:focus-visible{outline:3px solid var(--psg-blue);outline-offset:3px;}
  .opt svg{flex:1 1 auto;min-height:0;width:100%;height:100%;display:block;}
  .opt .otext{flex:1 1 auto;display:flex;align-items:center;justify-content:center;text-align:center;
    font-family:var(--font-head);font-weight:600;font-size:clamp(14px,min(2vw,2.8vh),22px);line-height:1.25;padding:0 4px;}
  .opt .label{flex:0 0 auto;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:clamp(10px,min(1.2vw,1.7vh),13px);color:#5A6B7D;}
  .opt.chosen-correct{border-color:var(--correct);background:#F1F8F3;}
  .opt.chosen-incorrect{border-color:var(--incorrect);background:#FDF3F2;}
  .opt.dimmed{opacity:.45;}
  .opt.locked{cursor:default;}

  .response{flex:0 0 auto;display:flex;flex-direction:column;gap:clamp(6px,1.2vh,12px);min-height:clamp(96px,19vh,160px);}
  .feedback{visibility:hidden;border-left:6px solid var(--psg-blue);background:var(--card-gray);border-radius:6px;
    padding:clamp(8px,1.4vh,14px) clamp(10px,1.4vw,18px);font-size:clamp(13px,min(1.8vw,2.4vh),17px);line-height:1.4;}
  .feedback.show{visibility:visible;}
  .feedback .verdict{font-family:var(--font-head);font-weight:700;display:block;margin-bottom:2px;font-size:1.05em;}
  .feedback.correct{border-left-color:var(--correct);} .feedback.correct .verdict{color:var(--correct);}
  .feedback.incorrect{border-left-color:var(--incorrect);} .feedback.incorrect .verdict{color:var(--incorrect);}
  .actions{visibility:hidden;flex:0 0 auto;}
  .actions.show{visibility:visible;}
  .actions button{font-family:var(--font-head);font-weight:600;font-size:clamp(13px,min(1.5vw,2vh),15px);
    color:var(--white);background:var(--psg-blue);border:none;border-radius:6px;
    padding:clamp(7px,1.2vh,11px) clamp(14px,1.8vw,22px);cursor:pointer;}
  .actions button:hover{background:#066890;}
  .actions button:focus-visible{outline:3px solid var(--psg-navy);outline-offset:2px;}

  @media (max-width:700px){
    .wrap{padding:10px;gap:7px;position:relative;max-height:430px;}
    .response{position:absolute;top:0;left:0;right:0;margin:0;padding:10px;min-height:0;z-index:5;background:transparent;pointer-events:none;}
    .response.active{background:var(--page-bg);pointer-events:auto;box-shadow:0 6px 16px rgba(12,35,64,.14);border-radius:0 0 10px 10px;}
    .given{height:auto;flex:1 1 105px;max-height:110px;min-height:64px;}
    .options{gap:6px;min-height:100px;}
    .opt{padding:3px;border-width:2px;border-radius:8px;gap:2px;}
    .opt .label{font-size:9px;letter-spacing:.02em;}
    .opt .otext{font-size:13px;line-height:1.2;padding:0 2px;}
    .rule{margin-bottom:5px;}
    .feedback{font-size:13px;line-height:1.35;padding:8px 10px;border-left-width:5px;}
    .hint{display:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="toprow"><h1 id="title"></h1><span class="progress" id="progress"></span></div>
    <div class="rule"></div>
    <p class="prompt" id="prompt"></p>
  </div>

  <div class="given" id="given" role="img"></div>
  <p class="hint" id="hint"></p>

  <div class="options" id="options" role="group" aria-labelledby="prompt"></div>

  <div class="response" id="response">
    <div class="feedback" id="feedback" role="status" aria-live="polite">
      <span class="verdict" id="verdict"></span><span id="explain"></span>
    </div>
    <div class="actions" id="actions"><button type="button" id="actionBtn">Try again</button></div>
  </div>
</div>

<script>
/* ================================================================
   EDIT BELOW THIS LINE TO CHANGE WORDING
   ----------------------------------------------------------------
   Each question shows a welding symbol ("given") and three
   drawings ("options"). Set correct:true on the right one.
   Drawing settings:
     tee    - side: "below" | "above" | "both"; sizeTop / sizeBottom
     teeOpt - left / right: weld size label ("" = no weld there)
     plan   - size, length ("" = none), joint (full joint length)
     planOpt- weld length drawn, as a fraction of the joint (0 to 1),
              plus the label shown on the dimension
   Keep feedback to about two lines.
   ================================================================ */
const COURSE_TITLE = "Read the Weld Length";

const QUESTIONS = [
  {
    prompt: "This joint is 12 inches long. Which drawing shows the weld the symbol calls for?",
    given: { type: "plan", size: "1/4", length: "", joint: "12" },
    givenAlt: "Top view of a 12 inch joint with a 1/4 fillet symbol and no length",
    options: [
      { draw: { type: "planOpt", frac: 1, label: "12" }, correct: true,
        alt: "Weld hatched along the full 12 inch joint",
        feedback: "No length is shown to the right of the symbol, so you weld the full length of the joint." },
      { draw: { type: "planOpt", frac: 0.5, label: "6" }, correct: false,
        alt: "Weld hatched along 6 inches of the joint",
        feedback: "Nothing on the symbol says to stop at 6 inches. With no length shown, weld the full joint." },
      { draw: { type: "planOpt", frac: 0.08, label: "1/4" }, correct: false,
        alt: "A very short weld, 1/4 inch long",
        feedback: "1/4 is the weld size, not the length. Size goes left of the symbol. Length goes right." }
    ],
    correctVerdict: "Exactly.", incorrectVerdict: "Not quite."
  },
  {
    prompt: "Same 12-inch joint, but the symbol has changed. Which drawing matches it?",
    given: { type: "plan", size: "1/4", length: "6", joint: "12" },
    givenAlt: "Top view of a 12 inch joint with a 1/4 fillet symbol and a length of 6",
    options: [
      { draw: { type: "planOpt", frac: 1, label: "12" }, correct: false,
        alt: "Weld hatched along the full 12 inch joint",
        feedback: "A number to the right of the symbol sets the length. Only weld the full joint when no length is shown." },
      { draw: { type: "planOpt", frac: 0.08, label: "1/4" }, correct: false,
        alt: "A very short weld, 1/4 inch long",
        feedback: "1/4 is the weld size. The length is the 6 on the right side of the symbol." },
      { draw: { type: "planOpt", frac: 0.5, label: "6" }, correct: true,
        alt: "Weld hatched along 6 inches of the joint",
        feedback: "The 6 to the right of the symbol is the weld length. Weld 6 inches, not the full joint." }
    ],
    correctVerdict: "You got it.", incorrectVerdict: "Close, but no."
  },
  {
    prompt: "The hatched areas show where to weld. How many inches of weld are there in total?",
    hint: "Select the correct answer.",
    given: { type: "hatch", segs: [ { len: 6, weld: true }, { len: 10 }, { len: 6, weld: true } ] },
    givenAlt: "Top view of a 22 inch joint. The first 6 inches and the last 6 inches are hatched. The 10 inches in the middle are not.",
    options: [
      { draw: { type: "text", text: "10 inches" }, correct: false, alt: "10 inches",
        feedback: "10 inches is the gap in the middle with no hatching. That part is not welded." },
      { draw: { type: "text", text: "12 inches" }, correct: true, alt: "12 inches",
        feedback: "Each hatched end is 6 inches. 6 + 6 = 12 inches of weld." },
      { draw: { type: "text", text: "22 inches" }, correct: false, alt: "22 inches",
        feedback: "22 inches is the whole joint. Only the hatched areas get welded." }
    ],
    correctVerdict: "Nice math.", incorrectVerdict: "Not quite."
  },
  {
    prompt: "This joint is 20 inches long. How long is the weld?",
    hint: "Select the correct answer.",
    given: { type: "hatch", segs: [ { len: 5 }, { len: 8, weld: true }, { len: 7 } ] },
    givenAlt: "Top view of a 20 inch joint split into 5, 8, and 7 inch sections. Only the 8 inch middle section is hatched.",
    options: [
      { draw: { type: "text", text: "20 inches" }, correct: false, alt: "20 inches",
        feedback: "20 inches is the whole joint. The hatching shows the weld is only part of it." },
      { draw: { type: "text", text: "8 inches" }, correct: true, alt: "8 inches",
        feedback: "The hatching covers only the 8-inch section, so the weld is 8 inches long." },
      { draw: { type: "text", text: "13 inches" }, correct: false, alt: "13 inches",
        feedback: "13 adds the 5-inch section, which has no hatching. Only weld what is hatched." }
    ],
    correctVerdict: "Right on.", incorrectVerdict: "Look again."
  },
  {
    prompt: "Put it together: What is the weld size on this symbol?",
    hint: "Select the correct answer.",
    given: { type: "sym", side: "below", sizeBottom: "3/8", lenBottom: "4" },
    givenAlt: "Welding symbol with 3/8 to the left and 4 to the right of a fillet symbol below the line",
    options: [
      { draw: { type: "text", text: "3/8 inch" }, correct: true, alt: "3/8 inch",
        feedback: "Size is always on the left of the symbol. This weld is 3/8." },
      { draw: { type: "text", text: "4 inches" }, correct: false, alt: "4 inches",
        feedback: "4 is on the right of the symbol, so it is the length. Size is on the left." },
      { draw: { type: "text", text: "Not shown" }, correct: false, alt: "Not shown on the symbol",
        feedback: "The size is shown. It is the number to the left of the symbol." }
    ],
    correctVerdict: "Spot on.", incorrectVerdict: "Not quite."
  },
  {
    prompt: "Put it together: What does this symbol call for?",
    hint: "Select the correct answer.",
    given: { type: "sym", side: "below", sizeBottom: "5/16", lenBottom: "10" },
    givenAlt: "Welding symbol with 5/16 to the left and 10 to the right of a fillet symbol below the line",
    options: [
      { draw: { type: "text", text: "5/16 weld, full length, arrow side" }, correct: false,
        alt: "5/16 weld, full length, arrow side",
        feedback: "The 10 on the right sets the length. Weld 10 inches, not the full joint." },
      { draw: { type: "text", text: "5/16 weld, 10 in. long, arrow side" }, correct: true,
        alt: "5/16 weld, 10 inches long, arrow side",
        feedback: "Size on the left, length on the right, and below the line means the arrow side." },
      { draw: { type: "text", text: "5/16 weld, 10 in. long, other side" }, correct: false,
        alt: "5/16 weld, 10 inches long, other side",
        feedback: "The numbers are right, but the symbol is below the line. That means the arrow side." }
    ],
    correctVerdict: "Well done.", incorrectVerdict: "Almost."
  },
  {
    prompt: "Put it together: What is needed on the arrow side?",
    hint: "Select the correct answer.",
    given: { type: "sym", side: "both", sizeTop: "1/4", lenTop: "6", sizeBottom: "3/8", lenBottom: "8" },
    givenAlt: "Welding symbol with 1/4 and 6 above the line, and 3/8 and 8 below the line",
    options: [
      { draw: { type: "text", text: "1/4 weld, 6 in. long" }, correct: false, alt: "1/4 weld, 6 inches long",
        feedback: "Those are the other-side numbers, above the line. The arrow side is below the line." },
      { draw: { type: "text", text: "3/8 weld, 6 in. long" }, correct: false, alt: "3/8 weld, 6 inches long",
        feedback: "The size is right, but each side has its own length. Below the line, the length is 8." },
      { draw: { type: "text", text: "3/8 weld, 8 in. long" }, correct: true, alt: "3/8 weld, 8 inches long",
        feedback: "Below the line is the arrow side: 3/8 size on the left, 8-inch length on the right." }
    ],
    correctVerdict: "Nailed it.", incorrectVerdict: "Tricky one."
  }
];
/* ================================================================
   NO EDITS NEEDED BELOW THIS LINE
   ================================================================ */

(function () {
  const INK = "#0C2340", WELD = "#5A6B7D", PART = "#E2E6EA", FONT = "Arial, Helvetica, sans-serif";
  let uid = 0;

  function txt(x, y, s, size, anchor) {
    return '<text x="' + x + '" y="' + y + '" font-family="' + FONT + '" font-size="' + (size || 15) +
      '" fill="' + INK + '" text-anchor="' + (anchor || "middle") + '">' + s + '</text>';
  }
  function hatch(id) {
    return '<defs><pattern id="' + id + '" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
      '<rect width="5" height="5" fill="#C9D0D8"/><line x1="0" y1="0" x2="0" y2="5" stroke="' + WELD + '" stroke-width="2.2"/></pattern></defs>';
  }
  function tee(ox, oy) {
    // base plate and upright member of a T-joint, corner points returned
    return '<rect x="' + (ox) + '" y="' + (oy + 100) + '" width="150" height="20" fill="' + PART + '" stroke="' + INK + '" stroke-width="2"/>' +
           '<rect x="' + (ox + 60) + '" y="' + oy + '" width="30" height="100" fill="' + PART + '" stroke="' + INK + '" stroke-width="2"/>';
  }
  function filletTri(x, y, s, dir) {
    // weld cross section in a corner: dir -1 = left corner, +1 = right corner
    return 'M' + x + ' ' + y + ' L' + (x + dir * s) + ' ' + y + ' L' + x + ' ' + (y - s) + ' Z';
  }
  function arrowHead(x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, h = 14, w = 5.5;
    const bx = x2 - ux * h, by = y2 - uy * h;
    return '<path d="M' + x2 + ' ' + y2 + ' L' + (bx - uy * w) + ' ' + (by + ux * w) + ' L' + (bx + uy * w) + ' ' + (by - ux * w) + ' Z" fill="' + INK + '"/>';
  }
  function sizePx(label) {
    return { "1/4": 18, "3/8": 28 }[label] || 18;
  }

  function drawTee(d) {
    // Joint on the left, reference line to the right. Arrow touches the RIGHT corner.
    const ox = 20, oy = 20, cx = ox + 90, cy = oy + 100;     // right corner (arrow side)
    const ly = 72, lx0 = 150, lx1 = 300;                     // reference line
    let s = '<svg viewBox="12 12 300 132" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">';
    s += tee(ox, oy);
    s += '<line x1="' + lx0 + '" y1="' + ly + '" x2="' + lx1 + '" y2="' + ly + '" stroke="' + INK + '" stroke-width="2.2"/>';
    s += '<line x1="' + lx0 + '" y1="' + ly + '" x2="' + (cx + 6) + '" y2="' + (cy - 7) + '" stroke="' + INK + '" stroke-width="2.2"/>';
    s += arrowHead(lx0, ly, cx + 1, cy - 1);
    const tx = 220, t = 20;                                  // fillet symbol: vertical leg on the LEFT
    if (d.side === "below" || d.side === "both") {
      s += '<path d="M' + tx + ' ' + ly + ' L' + tx + ' ' + (ly + t) + ' L' + (tx + t) + ' ' + ly + '" fill="none" stroke="' + INK + '" stroke-width="2.2"/>';
      s += txt(tx - 6, ly + 19, d.sizeBottom || "", 19, "end");
    }
    if (d.side === "above" || d.side === "both") {
      s += '<path d="M' + tx + ' ' + ly + ' L' + tx + ' ' + (ly - t) + ' L' + (tx + t) + ' ' + ly + '" fill="none" stroke="' + INK + '" stroke-width="2.2"/>';
      s += txt(tx - 6, ly - 5, d.sizeTop || "", 19, "end");
    }
    return s + '</svg>';
  }

  function drawTeeOpt(d) {
    const id = "h" + (uid++), ox = 25, oy = 18, ly = oy + 100;
    let s = '<svg viewBox="22 14 156 128" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">' + hatch(id);
    s += tee(ox, oy);
    if (d.left)  { const p = sizePx(d.left);  s += '<path d="' + filletTri(ox + 60, ly, p, -1) + '" fill="url(#' + id + ')" stroke="' + INK + '" stroke-width="1.6"/>' + txt(ox + 60 - p - 4, ly - p + 6, d.left, 17, "end"); }
    if (d.right) { const p = sizePx(d.right); s += '<path d="' + filletTri(ox + 90, ly, p, 1) + '" fill="url(#' + id + ')" stroke="' + INK + '" stroke-width="1.6"/>' + txt(ox + 90 + p + 4, ly - p + 6, d.right, 17, "start"); }
    return s + '</svg>';
  }

  function plateTop(x, y, w) {
    // top view of a T-joint: base plate with the upright member as a center strip
    return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="70" fill="' + PART + '" stroke="' + INK + '" stroke-width="2"/>' +
           '<line x1="' + x + '" y1="' + (y + 28) + '" x2="' + (x + w) + '" y2="' + (y + 28) + '" stroke="' + INK + '" stroke-width="1.8"/>' +
           '<line x1="' + x + '" y1="' + (y + 42) + '" x2="' + (x + w) + '" y2="' + (y + 42) + '" stroke="' + INK + '" stroke-width="1.8"/>';
  }
  function dimLine(x0, x1, y, label) {
    let s = '<line x1="' + x0 + '" y1="' + (y - 7) + '" x2="' + x0 + '" y2="' + (y + 7) + '" stroke="' + INK + '" stroke-width="1.3"/>';
    s += '<line x1="' + x1 + '" y1="' + (y - 7) + '" x2="' + x1 + '" y2="' + (y + 7) + '" stroke="' + INK + '" stroke-width="1.3"/>';
    s += '<line x1="' + x0 + '" y1="' + y + '" x2="' + x1 + '" y2="' + y + '" stroke="' + INK + '" stroke-width="1.3"/>';
    s += '<path d="M' + x0 + ' ' + y + ' l7 -3.5 v7 z M' + x1 + ' ' + y + ' l-7 -3.5 v7 z" fill="' + INK + '"/>';
    const w = x1 - x0;
    if (w > 40) s += '<rect x="' + ((x0 + x1) / 2 - 15) + '" y="' + (y - 11) + '" width="30" height="20" fill="#fff"/>' + txt((x0 + x1) / 2, y + 6, label, 18);
    else s += txt(x1 + 6, y + 6, label, 18, "start");
    return s;
  }

  function drawPlan(d) {
    const x = 20, y = 18, w = 160, ly = 56, lx0 = 205, lx1 = 305, ey = y + 42;
    let s = '<svg viewBox="12 10 300 120" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">';
    s += plateTop(x, y, w);
    s += dimLine(x, x + w, y + 98, d.joint);
    s += '<line x1="' + lx0 + '" y1="' + ly + '" x2="' + lx1 + '" y2="' + ly + '" stroke="' + INK + '" stroke-width="2.2"/>';
    s += '<line x1="' + lx0 + '" y1="' + ly + '" x2="' + (x + w - 34) + '" y2="' + (ey + 1) + '" stroke="' + INK + '" stroke-width="2.2"/>';
    s += arrowHead(lx0, ly, x + w - 40, ey + 1);
    const tx = 262, t = 20;
    s += '<path d="M' + tx + ' ' + ly + ' L' + tx + ' ' + (ly + t) + ' L' + (tx + t) + ' ' + ly + '" fill="none" stroke="' + INK + '" stroke-width="2.2"/>';
    s += txt(tx - 6, ly + 19, d.size, 19, "end");
    if (d.length) s += txt(tx + t + 6, ly + 19, d.length, 19, "start");
    return s + '</svg>';
  }

  function drawPlanOpt(d) {
    const id = "h" + (uid++), x = 15, y = 12, w = 170, ey = y + 42;
    let s = '<svg viewBox="10 8 180 120" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">' + hatch(id);
    s += plateTop(x, y, w);
    const len = Math.max(6, w * d.frac);
    s += '<rect x="' + x + '" y="' + ey + '" width="' + len + '" height="9" fill="url(#' + id + ')" stroke="' + INK + '" stroke-width="1.2"/>';
    s += dimLine(x, x + len, y + 100, d.label);
    return s + '</svg>';
  }


  function drawText(d) {
    return '<span class="otext">' + d.text + '</span>';
  }

  function drawSymOnly(d) {
    // a welding symbol on its own: arrow, reference line, fillet symbol, numbers on each side
    const ly = 58, lx0 = 70, lx1 = 250, tx = 160, t = 22;
    let s = '<svg viewBox="10 10 250 100" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">';
    s += '<line x1="' + lx0 + '" y1="' + ly + '" x2="' + lx1 + '" y2="' + ly + '" stroke="' + INK + '" stroke-width="2.4"/>';
    s += '<line x1="' + lx0 + '" y1="' + ly + '" x2="' + 30 + '" y2="' + 98 + '" stroke="' + INK + '" stroke-width="2.4"/>';
    s += arrowHead(lx0, ly, 24, 104);
    if (d.side === "below" || d.side === "both") {
      s += '<path d="M' + tx + ' ' + ly + ' L' + tx + ' ' + (ly + t) + ' L' + (tx + t) + ' ' + ly + '" fill="none" stroke="' + INK + '" stroke-width="2.4"/>';
      s += txt(tx - 6, ly + 25, d.sizeBottom || "", 24, "end") + txt(tx + t + 8, ly + 25, d.lenBottom || "", 24, "start");
    }
    if (d.side === "above" || d.side === "both") {
      s += '<path d="M' + tx + ' ' + ly + ' L' + tx + ' ' + (ly - t) + ' L' + (tx + t) + ' ' + ly + '" fill="none" stroke="' + INK + '" stroke-width="2.4"/>';
      s += txt(tx - 6, ly - 6, d.sizeTop || "", 24, "end") + txt(tx + t + 8, ly - 6, d.lenTop || "", 24, "start");
    }
    return s + '</svg>';
  }

  function drawHatch(d) {
    // top view of a joint; hatched segments show where to weld, with a chain of dimensions below
    const id = "h" + (uid++), x = 20, y = 10, w = 270, ey = y + 42;
    const total = d.segs.reduce(function (a, g) { return a + g.len; }, 0);
    let s = '<svg viewBox="10 4 290 128" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">' + hatch(id);
    s += plateTop(x, y, w);
    let cx = x;
    d.segs.forEach(function (g) {
      const gw = w * g.len / total;
      if (g.weld) s += '<rect x="' + cx + '" y="' + ey + '" width="' + gw + '" height="9" fill="url(#' + id + ')" stroke="' + INK + '" stroke-width="1.2"/>';
      s += dimLine(cx, cx + gw, y + 100, String(g.len));
      cx += gw;
    });
    let bx = x;
    [0].concat(d.segs.map(function (g) { return g.len; })).forEach(function (len) {
      bx += w * len / total;
      s += '<line x1="' + bx + '" y1="' + (y + 72) + '" x2="' + bx + '" y2="' + (y + 106) + '" stroke="' + INK + '" stroke-width="1"/>';
    });
    return s + '</svg>';
  }

  const DRAW = { tee: drawTee, teeOpt: drawTeeOpt, plan: drawPlan, planOpt: drawPlanOpt, text: drawText, sym: drawSymOnly, hatch: drawHatch };

  const titleEl = document.getElementById("title"), progEl = document.getElementById("progress");
  const promptEl = document.getElementById("prompt"), givenEl = document.getElementById("given");
  const grid = document.getElementById("options"), resp = document.getElementById("response");
  const fb = document.getElementById("feedback"), verdict = document.getElementById("verdict");
  const explain = document.getElementById("explain"), actions = document.getElementById("actions");
  const btn = document.getElementById("actionBtn"), hintEl = document.getElementById("hint");
  titleEl.textContent = COURSE_TITLE; document.title = COURSE_TITLE;

  let qi = 0, cards = [], mode = "retry";

  function load(i) {
    qi = i;
    const q = QUESTIONS[i];
    progEl.textContent = QUESTIONS.length > 1 ? "Question " + (i + 1) + " of " + QUESTIONS.length : "";
    promptEl.textContent = q.prompt;
    givenEl.innerHTML = DRAW[q.given.type](q.given);
    givenEl.setAttribute("aria-label", q.givenAlt || ("Drawing for question " + (i + 1)));
    hintEl.textContent = q.hint || "Select the drawing that shows the correct weld.";
    grid.innerHTML = "";
    cards = q.options.map(function (o, j) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "opt";
      const letter = String.fromCharCode(65 + j);
      b.setAttribute("aria-label", "Option " + letter + ": " + o.alt);
      b.innerHTML = DRAW[o.draw.type](o.draw) + '<span class="label">Option ' + letter + '</span>';
      b.addEventListener("click", function () { choose(j); });
      grid.appendChild(b);
      return b;
    });
    reset();
  }

  function choose(j) {
    if (grid.dataset.locked === "1") return;
    const q = QUESTIONS[qi], o = q.options[j];
    grid.dataset.locked = "1";
    cards.forEach(function (c, k) {
      c.classList.add("locked");
      c.classList.add(k === j ? (o.correct ? "chosen-correct" : "chosen-incorrect") : "dimmed");
    });
    verdict.textContent = o.correct ? q.correctVerdict : q.incorrectVerdict;
    explain.textContent = " " + o.feedback;
    fb.className = "feedback show " + (o.correct ? "correct" : "incorrect");
    if (o.correct) {
      mode = qi < QUESTIONS.length - 1 ? "next" : "restart";
      btn.textContent = mode === "next" ? "Next question" : (QUESTIONS.length > 1 ? "Start over" : "Try it again");
    } else {
      mode = "retry"; btn.textContent = "Try again";
    }
    actions.className = "actions show";
    resp.classList.add("active");
    btn.focus({ preventScroll: true });
  }

  function reset() {
    grid.dataset.locked = "0";
    cards.forEach(function (c) { c.className = "opt"; });
    fb.className = "feedback"; actions.className = "actions";
    resp.classList.remove("active");
  }

  btn.addEventListener("click", function () {
    if (mode === "next") load(qi + 1);
    else if (mode === "restart") load(0);
    else reset();
    if (cards[0]) cards[0].focus({ preventScroll: true });
  });

  load(0);
})();
</script>
</body>
</html>
